services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENREFRAME_UPLOAD_DIR=/data/uploads
      - OPENREFRAME_OUTPUT_DIR=/data/outputs
    volumes:
      - media-data:/data
    depends_on:
      - redis
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    command: python -m app.workers.queue
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENREFRAME_UPLOAD_DIR=/data/uploads
      - OPENREFRAME_OUTPUT_DIR=/data/outputs
    volumes:
      - media-data:/data
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  redis-data:
  media-data:
